<!doctype html><meta charset="utf-8"><title>Stepped pixel font test</title>
<style>
@font-face { font-family: "Pixel Step"; src: url(out/PixelStep-VF.woff2); font-weight: 400 700; }
body { margin: 16px; font: 12px system-ui; }
.s { font-family: "Pixel Step"; font-optical-sizing: auto; line-height: 1; margin: 4px 0; white-space: pre; }
table { border-collapse: collapse; margin: 12px 0; } td, th { border: 1px solid #ccc; padding: 2px 8px; text-align: right; font-variant-numeric: tabular-nums; }
</style>
<h3>Automatic optical sizing (font-optical-sizing: auto), weight 400</h3>
<div id="rows"></div>
<h3>Weight steps at 16px: 400 / 500 / 549 / 550 / 600 / 700</h3>
<div id="w"></div>
<h3>Measured on a canvas at this display's density (devicePixelRatio = <span id="dpr"></span>)</h3>
<p>Gray = pixels that are neither paper nor ink. A true bitmap scores 0.</p>
<table id="t"><tr><th>size</th><th>weight</th><th>ink px</th><th>gray px</th><th>verdict</th></tr></table>
<script>
const text = 'Hamburgefonstiv 0123 @&%';
const rows = document.getElementById('rows');
for (const s of [8, 9, 10, 11, 12, 13, 14, 16, 24, 32]) {
  const p = document.createElement('p'); p.className = 's'; p.style.fontSize = s + 'px';
  p.textContent = `${String(s).padStart(2)}px  ${text}`; rows.append(p);
}
const w = document.getElementById('w');
for (const wt of [400, 500, 549, 550, 600, 700]) {
  const p = document.createElement('p'); p.className = 's'; p.style.fontSize = '16px'; p.style.fontWeight = wt;
  p.textContent = `${wt}  ${text}`; w.append(p);
}
document.getElementById('dpr').textContent = devicePixelRatio;
function measure(size, weight) {
  const dpr = devicePixelRatio, c = document.createElement('canvas');
  c.width = 400 * dpr; c.height = 40 * dpr;
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 400, 40);
  ctx.fillStyle = '#000'; ctx.font = `${weight} ${size}px "Pixel Step"`; ctx.fontKerning = 'none';
  ctx.fillText(text, 2, 30);
  const d = ctx.getImageData(0, 0, c.width, c.height).data;
  let ink = 0, gray = 0;
  for (let i = 0; i < d.length; i += 4) { const v = d[i]; if (v < 8) ink++; else if (v < 248) gray++; }
  return { ink, gray };
}
document.fonts.load('16px "Pixel Step"').then(() => {
  const t = document.getElementById('t');
  for (const [size, weight] of [[8, 400], [8, 700], [10, 400], [11, 400], [12, 400], [13, 400], [16, 400], [16, 500], [16, 549], [16, 550], [16, 700], [24, 400], [32, 700]]) {
    const { ink, gray } = measure(size, weight);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${size}px</td><td>${weight}</td><td>${ink}</td><td>${gray}</td><td>${gray === 0 ? 'pixel-perfect' : 'blurry'}</td>`;
    t.append(tr);
  }
  document.title = 'measured';
});
</script>
