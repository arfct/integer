<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integer specimen</title>
<style>
  @font-face {
    font-family: "Integer";
    src: url(out/Integer-VF.woff2) format("woff2");
    font-weight: 400 700;
    font-style: oblique 0deg 18deg;
  }
  :root { color-scheme: light dark; --ink: #000; --paper: #fff; --mute: #666; }
  @media (prefers-color-scheme: dark) { :root { --ink: #fff; --paper: #000; --mute: #999; } }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; }
  .controls { position: sticky; top: 0; background: var(--paper); border-bottom: 1px solid var(--mute);
    padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
  .controls label { display: flex; align-items: center; gap: 8px; }
  .controls input[type=range] { width: 140px; }
  .controls output { font-variant-numeric: tabular-nums; min-width: 3ch; display: inline-block; }
  #crisp { color: var(--mute); }
  #crisp.yes { color: #0a0; }
  main { padding: 16px; }
  .sample { font-family: "Integer"; -webkit-font-smoothing: none; margin: 0 0 8px;
    font-size: var(--size); line-height: 1; font-weight: var(--wght);
    font-variation-settings: "slnt" var(--slnt), "ROND" var(--rond); white-space: pre-wrap; }
  .ladder .sample { --wght: attr(data-wght type(<number>), 400); }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--mute); margin: 24px 0 8px; }
  textarea { width: 100%; box-sizing: border-box; font: inherit; }
</style>
<div class="controls">
  <label>Size <input type="range" id="size" min="8" max="96" value="16" step="1"> <output id="size-out">16</output>px
    <span id="crisp"></span></label>
  <label>Weight <input type="range" id="wght" min="400" max="700" value="400" step="10"> <output id="wght-out">400</output></label>
  <label>Slant <input type="range" id="slnt" min="-18" max="0" value="0" step="1"> <output id="slnt-out">0</output>°</label>
  <label>Round <input type="range" id="rond" min="0" max="100" value="0" step="5"> <output id="rond-out">0</output></label>
</div>
<main>
  <h2>Weight ladder (400 to 700) at the chosen size</h2>
  <div class="ladder" id="ladder"></div>
  <h2>Your text</h2>
  <textarea id="text" rows="3">The quick brown fox jumps over the lazy dog. 0123456789 @&amp;% Åéîõü — “quotes” ©®™</textarea>
  <p class="sample" id="free"></p>
  <h2>Every mapped character</h2>
  <p class="sample" id="all"></p>
</main>
<script>
  const root = document.documentElement.style;
  const el = id => document.getElementById(id);
  const ladder = el('ladder');
  for (const w of [400, 450, 500, 550, 600, 650, 700]) {
    const p = document.createElement('p');
    p.className = 'sample'; p.style.setProperty('--wght', w);
    p.textContent = `${w}  Hamburgefonstiv — The quick brown fox jumps over the lazy dog`;
    ladder.append(p);
  }
  function update() {
    for (const k of ['size', 'wght', 'slnt', 'rond']) el(k + '-out').value = el(k).value;
    root.setProperty('--size', el('size').value + 'px');
    root.setProperty('--wght', el('wght').value);
    root.setProperty('--slnt', el('slnt').value);
    root.setProperty('--rond', el('rond').value);
    const dev = el('size').value * devicePixelRatio;
    const crisp = Number.isInteger(dev / 16);
    el('crisp').textContent = crisp ? `crisp: ${dev / 16} device px per font px` : `blurry at ${devicePixelRatio}x (needs a multiple of ${16 / devicePixelRatio}px)`;
    el('crisp').className = crisp ? 'yes' : '';
    el('free').textContent = el('text').value;
  }
  for (const k of ['size', 'wght', 'slnt', 'rond', 'text']) el(k).addEventListener('input', update);
  fetch('out/charset.txt').then(r => r.text()).then(t => { el('all').textContent = [...t].sort((a, b) => a.codePointAt(0) - b.codePointAt(0)).join(''); });
  document.fonts.load('16px "Integer"').then(update);
  update();
</script>
</html>
